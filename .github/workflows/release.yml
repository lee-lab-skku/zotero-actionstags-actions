name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  zotero:
    uses: ./.github/workflows/zotero-integration.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: [test, zotero]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified release backups
        uses: actions/download-artifact@v8
        with:
          name: verified-backups-${{ github.sha }}
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/actions-zotero.yml
            dist/actions-zotero.json
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
