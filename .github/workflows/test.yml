name: Test

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install Python dependencies
        run: python -m pip install PyYAML

      - name: Build backups
        run: python build.py

      - name: Validate and package the agent skill
        run: python build_skill.py

      - name: Test build and generated backups
        run: python -m unittest discover -s tests/build -p 'test_*.py'

      - name: Test action logic
        run: node --test tests/unit/*.test.cjs

      - name: Test action harness and coverage mapping
        run: node --test tests/tooling/*.test.cjs

      - name: Test HTTP bridge socket
        run: node --test tests/integration/http/*.test.cjs

      - name: Check commit whitespace
        run: git show --format= --check --diff-merges=first-parent HEAD

      - name: Save verified release skill
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: verified-skill-${{ github.sha }}
          path: dist/zot-jot.zip
          if-no-files-found: error
          retention-days: 7
